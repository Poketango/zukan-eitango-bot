name: daily-shorts
on:
  schedule:
    - cron: "5 22 * * *"   # 朝 7:05（日本時間）
    - cron: "5 3 * * *"    # 昼 12:05
    - cron: "5 10 * * *"   # 夜 19:05
  workflow_dispatch:
    inputs:
      dry_run:
        description: "1にすると投稿せず動画だけ作る"
        default: "1"
      kind:
        description: "name（英語名クイズ）か scary（怖い図鑑）を指定すると、その型で作る（空欄なら自動）"
        default: ""
jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      # 読み上げ（ずんだもん・冥鳴ひまり）用の VOICEVOX エンジン
      voicevox:
        image: voicevox/voicevox_engine:cpu-latest
        ports:
          - 50021:50021
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk fonts-noto-cjk-extra ffmpeg
      - run: pip install -q pillow numpy google-api-python-client google-auth
      - name: VOICEVOX の起動を待つ
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:50021/version; then echo " ready"; exit 0; fi
            sleep 3
          done
          echo "VOICEVOX が起動しなかったので、ナレーションなしで作ります"
      - run: python post.py
        env:
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          KIND: ${{ github.event.inputs.kind }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: short
          path: |
            short.mp4
            thumb.png
