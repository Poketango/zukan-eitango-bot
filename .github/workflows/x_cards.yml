name: x-cards
# X（@zukan_eitango）に投稿する雑学カード画像を作って x/ に置く。台本（scripts/long）が更新されたら自動で動く
on:
  push:
    branches: [main]
    paths: ["scripts/long/**", "x_cards.py"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: x-cards
  cancel-in-progress: false
jobs:
  cards:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk fonts-noto-cjk-extra
      - run: pip install -q pillow numpy google-api-python-client google-auth cryptography
      - name: カードを作る（x を持つ台本すべて）
        run: |
          for f in scripts/long/*.json; do
            n=$(basename "$f" .json)
            if python -c "import json,sys; d=json.load(open('$f')); sys.exit(0 if any('x' in t for t in d['topics']) else 1)"; then
              python x_cards.py "$n" x
            fi
          done
      - name: コミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add x
          git diff --cached --quiet && exit 0
          git commit -m "Xの雑学カードを更新"
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin main && exit 0; sleep 5; done
          exit 1
