name: link-zatsugaku-channel
# 雑学チャンネルをボットにつなぐ（最初に1回だけ手動で実行）
on:
  workflow_dispatch:
    inputs:
      code:
        description: "承認後のページに出た Authorization code（またはアドレス欄の文字全部）"
        required: true
permissions:
  contents: write
jobs:
  link:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q cryptography
      - run: python link_channel.py
        env:
          AUTH_CODE: ${{ github.event.inputs.code }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      - name: 暗号化した鍵をリポジトリに保存
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add yt2_token.enc
          git commit -m "雑学チャンネルの鍵（暗号化済み）を保存"
          git push
