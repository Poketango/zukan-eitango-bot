name: test-shorts
# 試し作り（投稿しない）。test-shorts ブランチに push すると、型ごとにショートを作って、動画と場面の一覧を test_out/ に保存する
on:
  push:
    branches: [test-shorts]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      voicevox:
        image: voicevox/voicevox_engine:cpu-latest
        ports:
          - 50021:50021
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk fonts-noto-cjk-extra ffmpeg
      - run: pip install -q pillow numpy google-api-python-client google-auth
      - run: |
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:50021/version && break; sleep 3; done
      - run: |
          mkdir -p test_out
          for k in name speed5 plus which; do
            DRY_RUN=1 KIND=$k python post.py > test_out/$k.log 2>&1 || true
            [ -f short.mp4 ] && mv short.mp4 test_out/$k.mp4
            for s in 1 3 5 7 9 11 13 15; do ffmpeg -v error -y -ss $s -i test_out/$k.mp4 -frames:v 1 -vf scale=270:-1 test_out/${k}_$s.png || true; done
          done
          python - <<'PY'
          import json, urllib.request, urllib.parse
          out = []
          for t in ["この英語名、エレキッド。だーれだ？", "グルーム", "正解は、クサイハナなのだ！英語名は、グルームなのだ。", "ヴィーナソー"]:
              q = json.loads(urllib.request.urlopen(urllib.request.Request("http://127.0.0.1:50021/audio_query?" + urllib.parse.urlencode({"text": t, "speaker": 3}), method="POST")).read())
              out.append(t + " → " + q.get("kana", ""))
          open("test_out/kana.txt", "w").write("\n".join(out))
          PY
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f test_out && git commit -m "試し作りの結果" && git push
